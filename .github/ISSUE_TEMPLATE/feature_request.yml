name: 功能建议 / Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索[已有 Issues](https://github.com/Verlintas/NovaBAIC/issues?q=is%3Aissue)，确认没有重复。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景或痛点
      placeholder: 我在 ... 场景下需要 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如有交互草图或参考应用更好
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能区域
      options:
        - 聊天体验 / UI
        - 设备工具与 UI 自动化
        - Agent 自主能力（计划 / 验证 / 子代理）
        - 自动化 / 技能 / MCP
        - 隐私与安全
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
